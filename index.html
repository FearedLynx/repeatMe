<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepeatMe</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #16181d; --panel: #1e2128; --border: #2c313a; --text: #d7dae0; --muted: #7d8590;
    --accent: #61afef; --ok: #98c379; --warn: #e5c07b; --bad: #e06c75; --hint: #c678dd;
  }
  [data-theme="light"] {
    --bg: #f6f6f4; --panel: #ffffff; --border: #dedcd6; --text: #24292f; --muted: #6e7781;
    --accent: #0969da; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --hint: #8250df;
  }
  [data-theme="solarized"] {
    --bg: #fdf6e3; --panel: #eee8d5; --border: #d9d2bd; --text: #586e75; --muted: #93a1a1;
    --accent: #268bd2; --ok: #859900; --warn: #b58900; --bad: #dc322f; --hint: #6c71c4;
  }
  [data-theme="dracula"] {
    --bg: #282a36; --panel: #303241; --border: #44475a; --text: #f8f8f2; --muted: #8a8fb3;
    --accent: #8be9fd; --ok: #50fa7b; --warn: #f1fa8c; --bad: #ff5555; --hint: #ff79c6;
  }
  [data-theme="nord"] {
    --bg: #2e3440; --panel: #3b4252; --border: #4c566a; --text: #e5e9f0; --muted: #8f9bb3;
    --accent: #88c0d0; --ok: #a3be8c; --warn: #ebcb8b; --bad: #bf616a; --hint: #b48ead;
  }
  [data-theme="gruvbox"] {
    --bg: #282828; --panel: #32302f; --border: #504945; --text: #ebdbb2; --muted: #928374;
    --accent: #83a598; --ok: #b8bb26; --warn: #fabd2f; --bad: #fb4934; --hint: #d3869b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono, textarea, .code, .code input { font-family: Consolas, "Courier New", monospace; font-size: 15px; font-variant-ligatures: none; }
  #editor { height: calc(100vh - 230px); min-height: 360px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  #editor textarea { height: 100%; min-height: 0; border: none; border-radius: 0; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  kbd { font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; margin-right: auto; cursor: pointer; }
  header h1 span { color: var(--accent); }
  header label { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }

  /* library */
  .prog { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .prog .name { font-weight: 600; font-size: 16px; cursor: pointer; }
  .prog .name:hover { color: var(--accent); }
  .prog .count { font-variant-numeric: tabular-nums; }
  .prog .count b { color: var(--accent); }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--ok); color: var(--ok); }
  .history { margin: -6px 0 8px 16px; padding: 8px 14px; border-left: 2px solid var(--border); font-size: 14px;
    max-height: 220px; overflow-y: auto; font-variant-numeric: tabular-nums; }
  .history div { display: flex; gap: 16px; padding: 1px 0; }
  .history b { width: 44px; text-align: right; }
  .empty { text-align: center; padding: 40px; color: var(--muted); }

  /* editor */
  input.title { width: 100%; font-size: 18px; padding: 8px 10px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; }
  textarea { width: 100%; min-height: 420px; padding: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; resize: vertical; tab-size: 4; line-height: 1.6; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  /* practice */
  .status { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .status .pill { font-variant-numeric: tabular-nums; }
  .code { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 0; }
  .line { display: flex; align-items: center; min-height: 26px; padding: 0 12px 0 0; }
  .line .no { width: 44px; text-align: right; padding-right: 14px; color: var(--muted); user-select: none; flex: none; }
  .line .txt { white-space: pre; flex: 1; overflow-x: auto; }
  .line .mark { width: 22px; text-align: center; flex: none; font-size: 13px; }
  .line.s-perfect .mark { color: var(--ok); }
  .line.s-mistake .mark { color: var(--warn); }
  .line.s-tip .mark { color: var(--hint); }
  .line.s-reveal .mark { color: var(--bad); }
  .line.context .txt { opacity: .55; }
  .line.current { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .line.current .no { color: var(--accent); }
  .line.gap { min-height: 12px; }
  .typed { position: relative; flex: 1; min-width: 0; overflow: hidden; border-bottom: 1px solid var(--accent); }
  .typed.wrong { border-bottom-color: var(--bad); animation: shake .25s; }
  .code input { display: block; width: 100%; height: 24px; line-height: 24px; background: transparent; border: none;
    color: var(--text); padding: 0; margin: 0; caret-color: var(--text); }
  /* with Monaco loaded, the input text is invisible and a colorized copy is drawn underneath it */
  .has-monaco .code input { color: transparent; }
  .typed .hl { position: absolute; left: 0; top: 0; line-height: 24px; white-space: pre; pointer-events: none; }
  .code .hl span, .code .txt span, .hintbox span { font-variant-ligatures: none; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .bulb { border: none; background: none; font-size: 18px; padding: 0 6px; filter: grayscale(1); opacity: .7; }
  .bulb:hover:not(:disabled) { filter: none; opacity: 1; }
  .hintbox { margin: 4px 12px 6px 44px; padding: 6px 10px; border-left: 3px solid var(--hint); font-size: 14px; }
  .hintbox.reveal { border-color: var(--bad); white-space: pre; }
  .hintbox .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-right: 8px; }
  .feedback { margin: 2px 12px 4px 44px; font-size: 13px; color: var(--bad); min-height: 0; }
  .remaining { color: var(--muted); padding: 6px 0 0 44px; font-size: 13px; }
  .legend { font-size: 13px; margin-top: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend .ok { color: var(--ok); } .legend .w { color: var(--warn); } .legend .h { color: var(--hint); } .legend .b { color: var(--bad); }

  .result { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-top: 16px; }
  .result h2 { margin: 0 0 6px; }
  .score { font-size: 40px; font-weight: 700; }
  .weak { margin: 12px 0; }
  .weak .line .txt { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1 id="home"><span>Repeat</span>Me</h1>
  <label title="Off: indentation is given and spaces are ignored. On: you type exact indentation and spacing.">
    <input type="checkbox" id="strict"> Strict whitespace
  </label>
  <label>Theme
    <select id="theme">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="solarized">Solarized</option>
      <option value="dracula">Dracula</option>
      <option value="nord">Nord</option>
      <option value="gruvbox">Gruvbox</option>
    </select>
  </label>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
/* ---------- Monaco (the editor inside VS Code), loaded from CDN; plain textarea if offline ---------- */

const MONACO = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
window.MonacoEnvironment = {
  getWorkerUrl: () => `data:text/javascript;charset=utf-8,${encodeURIComponent(
    `self.MonacoEnvironment={baseUrl:'${MONACO}/'};importScripts('${MONACO}/vs/base/worker/workerMain.js');`)}`,
};
const monacoReady = new Promise(resolve => {
  if (!window.require) return resolve(null);
  require.config({ paths: { vs: MONACO + '/vs' } });
  require(['vs/editor/editor.main'], () => {
    document.body.classList.add('has-monaco');
    applySettings();
    resolve(monaco);
    if (session) renderPractice();
  }, () => resolve(null));
});

// Token colors per app theme (dark/light use VS Code's own defaults)
const TOKENS = {
  dracula:   { keyword: 'ff79c6', string: 'f1fa8c', number: 'bd93f9', comment: '6272a4', type: '8be9fd', identifier: 'f8f8f2', delimiter: 'f8f8f2' },
  nord:      { keyword: '81a1c1', string: 'a3be8c', number: 'b48ead', comment: '616e88', type: '8fbcbb', identifier: 'd8dee9', delimiter: 'eceff4' },
  gruvbox:   { keyword: 'fb4934', string: 'b8bb26', number: 'd3869b', comment: '928374', type: 'fabd2f', identifier: 'ebdbb2', delimiter: 'ebdbb2' },
  solarized: { keyword: '859900', string: '2aa198', number: 'd33682', comment: '93a1a1', type: 'b58900', identifier: '586e75', delimiter: '657b83' },
};
const LIGHT = ['light', 'solarized'];

function applyMonacoTheme() {
  if (!window.monaco) return;
  const css = getComputedStyle(document.documentElement);
  const v = name => css.getPropertyValue(name).trim();
  const t = TOKENS[settings.theme] || {};
  monaco.editor.defineTheme('repeatme', {
    base: LIGHT.includes(settings.theme) ? 'vs' : 'vs-dark',
    inherit: true,
    rules: Object.entries(t).map(([token, fg]) => ({ token, foreground: fg, fontStyle: token === 'comment' ? 'italic' : '' })),
    colors: {
      'editor.background': v('--panel'),
      'editor.foreground': v('--text'),
      'editorLineNumber.foreground': v('--muted'),
      'editorLineNumber.activeForeground': v('--accent'),
      'editor.lineHighlightBackground': v('--bg'),
      'editorCursor.foreground': v('--accent'),
    },
  });
  monaco.editor.setTheme('repeatme');
}

// Colorize every element marked data-hl with Python syntax highlighting
function highlight(root = document) {
  if (!window.monaco) return;
  root.querySelectorAll('[data-hl]').forEach(el => {
    monaco.editor.colorize(el.textContent, 'python', { tabSize: 4 })
      .then(html => { el.innerHTML = html.replace(/<br\/?>\s*$/, ''); });
  });
}

let editor = null;
function disposeEditor() { if (editor) { editor.dispose(); editor = null; } }

const STORE ='repeatme.programs', SETTINGS = 'repeatme.settings';
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(programs)); }
function saveSettings() { localStorage.setItem(SETTINGS, JSON.stringify(settings)); }

const SAMPLE = `def quicksort(arr):
    # recursion stops on 0 or 1 elements
    if len(arr) <= 1:
        return arr
    pivot = arr[len(arr) // 2]  # middle element as pivot
    left = [x for x in arr if x < pivot]  # smaller than pivot
    middle = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]  # bigger than pivot
    return quicksort(left) + middle + quicksort(right)  # sort both sides, glue together`;

let programs = load(STORE, null);
if (!programs) {
  programs = [{ id: Date.now(), name: 'QuickSort', code: SAMPLE, revisions: 0, lastScore: null, bestScore: null, lastRevised: null }];
  save();
}
// programs saved before history existed: keep at least their last pass
for (const p of programs) if (!p.history && p.lastRevised) p.history = [{ score: p.lastScore, at: p.lastRevised }];
const settings = Object.assign({ theme: 'dark', strict: false }, load(SETTINGS, {}));

function applySettings() {
  document.documentElement.dataset.theme = settings.theme;
  $('#theme').value = settings.theme;
  $('#strict').checked = settings.strict;
  applyMonacoTheme();
}
$('#theme').onchange = e => { settings.theme = e.target.value; saveSettings(); applySettings(); };
$('#strict').onchange = e => { settings.strict = e.target.checked; saveSettings(); if (session) renderPractice(); };
$('#home').onclick = () => { if (!session || confirm('Leave this practice session?')) showLibrary(); };

/* ---------- parsing ---------- */

// Split a line into [code, comment] on the first # that is not inside a string literal.
function splitComment(line) {
  let quote = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quote) {
      if (c === '\\') i++;
      else if (c === quote) quote = null;
    } else if (c === '"' || c === "'") quote = c;
    else if (c === '#') return [line.slice(0, i), line.slice(i + 1).trim()];
  }
  return [line, null];
}

// Turns source into a list of {type:'code', code, indent, tips[]} and {type:'gap'} items.
// Tips for a code line = comment lines directly above it + its own inline comment.
function parse(source) {
  const items = [];
  let pending = [];
  for (const raw of source.replace(/\r/g, '').replace(/\t/g, '    ').split('\n')) {
    const [code, tip] = splitComment(raw);
    if (code.trim() === '') {
      if (tip !== null) { if (tip) pending.push(tip); }
      else { pending = []; if (items.length && items.at(-1).type !== 'gap') items.push({ type: 'gap' }); }
      continue;
    }
    const tips = [...pending];
    if (tip) tips.push(tip);
    const clean = code.replace(/\s+$/, '');
    items.push({ type: 'code', code: clean, indent: clean.match(/^ */)[0], tips });
    pending = [];
  }
  while (items.length && items.at(-1).type === 'gap') items.pop();
  return items;
}

function norm(s) {
  s = s.replace(/\t/g, '    ');
  return settings.strict ? s.replace(/\s+$/, '') : s.replace(/\s+/g, '');
}

/* ---------- library ---------- */

function ago(ts) {
  if (!ts) return 'never';
  const d = Math.floor((Date.now() - ts) / 86400000);
  return d === 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`;
}

const openHistory = new Set();
const scoreColor = s => s === 100 ? 'var(--ok)' : s >= 70 ? 'var(--warn)' : 'var(--bad)';

// Full-pass scores, newest first
function historyHtml(p) {
  const fmt = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<div class="history">${p.history.slice().reverse().map(h =>
    `<div><b style="color:${scoreColor(h.score)}">${h.score}%</b><span class="muted">${fmt.format(h.at)}</span></div>`).join('')}</div>`;
}

function showLibrary() {
  session = null;
  disposeEditor();
  document.onkeydown = null;
  const rows = programs.map(p => {
    const n = parse(p.code).filter(i => i.type === 'code').length;
    return `
    <div class="prog">
      <div>
        <div class="name" data-practice="${p.id}">${esc(p.name)}</div>
        <div class="muted" style="font-size:13px">${n} lines · last ${ago(p.lastRevised)}${p.lastScore != null ? ` · last score ${p.lastScore}%` : ''}</div>
      </div>
      ${p.lastScore === 100 ? '<span class="badge">memorised</span>' : ''}
      <div class="spacer"></div>
      <div class="count">Times revised – <b>${p.revisions}</b></div>
      <button class="primary" data-practice="${p.id}">Practice</button>
      <button data-hist="${p.id}" ${p.history?.length ? '' : 'disabled title="No full passes yet"'}>History</button>
      <button data-edit="${p.id}">Edit</button>
      <button class="danger" data-del="${p.id}">✕</button>
    </div>
    ${openHistory.has(p.id) && p.history?.length ? historyHtml(p) : ''}`;
  }).join('');
  app.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <button class="primary" id="new">+ Add code</button>
      <div class="spacer"></div>
      <button id="export" title="Save all programs to a .json file">Export</button>
      <button id="import" title="Load programs from a .json file">Import</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
    ${rows || '<div class="empty">No programs yet. Click “+ Add code”.</div>'}`;

  $('#new').onclick = () => showEditor(null);
  app.querySelectorAll('[data-practice]').forEach(b => b.onclick = () => startSession(+b.dataset.practice, 'full'));
  app.querySelectorAll('[data-hist]').forEach(b => b.onclick = () => {
    const id = +b.dataset.hist;
    openHistory.has(id) ? openHistory.delete(id) : openHistory.add(id);
    showLibrary();
  });
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => showEditor(+b.dataset.edit));
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const p = programs.find(p => p.id === +b.dataset.del);
    if (confirm(`Delete "${p.name}"?`)) { programs = programs.filter(x => x !== p); save(); showLibrary(); }
  });
  $('#export').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(programs, null, 2)], { type: 'application/json' }));
    a.download = `repeatme-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  };
  $('#import').onclick = () => $('#file').click();
  $('#file').onchange = async e => {
    try {
      const data = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(data)) throw 0;
      let added = 0;
      for (const p of data) {
        if (typeof p.name !== 'string' || typeof p.code !== 'string') continue;
        const existing = programs.find(x => x.id === p.id);
        if (existing) Object.assign(existing, p); else programs.push(p);
        added++;
      }
      save(); showLibrary(); alert(`Imported ${added} program(s).`);
    } catch { alert('That file does not look like a RepeatMe export.'); }
  };
}

/* ---------- editor ---------- */

function showEditor(id) {
  session = null;
  disposeEditor();
  const p = programs.find(p => p.id === id);
  app.innerHTML = `
    <input class="title" id="name" placeholder="Name, e.g. MergeSort" value="${p ? esc(p.name) : ''}">
    <div id="editor"><textarea id="code" spellcheck="false"></textarea></div>
    <div class="row" style="margin-top:10px">
      <span class="muted" id="info"></span>
      <span class="muted" style="font-size:13px">Anything after <code>#</code> is a tip · a comment on its own line is the tip for the line below</span>
      <div class="spacer"></div>
      <button id="cancel">Cancel</button>
      <button class="primary" id="save">Save <kbd>Ctrl+S</kbd></button>
    </div>`;
  const ta = $('#code');
  ta.value = p ? p.code : '';
  const getCode = () => editor ? editor.getValue() : ta.value;
  const info = () => {
    const items = parse(getCode()).filter(i => i.type === 'code');
    $('#info').textContent = `${items.length} lines to memorise · ${items.filter(i => i.tips.length).length} with tips ·`;
  };
  info();
  ta.oninput = info;
  ta.onkeydown = e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      document.execCommand('insertText', false, '    ');
    } else if (e.key === 'Enter') {
      // keep indentation, indent one more level after a colon
      const before = ta.value.slice(0, ta.selectionStart);
      const cur = before.slice(before.lastIndexOf('\n') + 1);
      let ind = cur.match(/^ */)[0];
      if (splitComment(cur)[0].trimEnd().endsWith(':')) ind += '    ';
      e.preventDefault();
      document.execCommand('insertText', false, '\n' + ind);
    }
  };
  const doSave = () => {
    const name = $('#name').value.trim(), code = getCode().replace(/\s+$/, '');
    if (!name) return $('#name').focus();
    if (!parse(code).some(i => i.type === 'code')) return (editor || ta).focus();
    if (p) Object.assign(p, { name, code });
    else programs.push({ id: Date.now(), name, code, revisions: 0, lastScore: null, bestScore: null, lastRevised: null });
    save(); showLibrary();
  };
  $('#save').onclick = doSave;
  $('#cancel').onclick = showLibrary;
  document.onkeydown = e => { if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); } };
  (p ? ta : $('#name')).focus();

  // swap the textarea for Monaco once it has loaded
  const view = app.firstElementChild;
  monacoReady.then(m => {
    if (!m || app.firstElementChild !== view) return;
    const hadFocus = document.activeElement === ta;
    const value = ta.value;
    ta.remove();
    editor = m.editor.create($('#editor'), {
      value, language: 'python', theme: 'repeatme',
      fontFamily: 'Consolas, "Courier New", monospace', fontSize: 15, fontLigatures: false,
      tabSize: 4, insertSpaces: true, detectIndentation: false,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true,
      renderWhitespace: 'boundary', guides: { indentation: true }, bracketPairColorization: { enabled: true },
      padding: { top: 10 },
    });
    editor.onDidChangeModelContent(info);
    editor.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.KeyS, doSave);
    if (hadFocus || p) editor.focus();
  });
}

/* ---------- practice ---------- */

let session = null;

// mode 'full': type every line. mode 'drill': only the given weak lines, with the code above shown as context.
function startSession(id, mode, targets) {
  const prog = programs.find(p => p.id === id);
  const items = parse(prog.code);
  const codeIdx = items.map((it, i) => it.type === 'code' ? i : -1).filter(i => i >= 0);
  session = {
    prog, items, mode,
    targets: targets ?? codeIdx,
    pos: 0,            // index into targets
    hint: 0,           // 0 none, 1 tip shown, 2 line revealed
    tries: 0,
    results: {},       // item index -> 'perfect' | 'mistake' | 'tip' | 'reveal'
    started: Date.now(),
    round: (session && session.prog === prog ? session.round : 0) + 1,
    feedback: '',
  };
  renderPractice();
}

const MARK = { perfect: '✓', mistake: '✗', tip: '💡', reveal: '👁' };

function lineHtml(i, item, cls = '', mark = '') {
  return `<div class="line ${cls}"><span class="no">${i}</span><span class="txt" data-hl>${esc(item.code)}</span><span class="mark">${mark}</span></div>`;
}

function renderPractice() {
  const s = session;
  if (s.pos >= s.targets.length) return renderResult();
  const cur = s.targets[s.pos];
  const item = s.items[cur];
  const numbers = {};
  let n = 0;
  s.items.forEach((it, i) => { if (it.type === 'code') numbers[i] = ++n; });

  let html = '';
  for (let i = 0; i < cur; i++) {
    const it = s.items[i];
    if (it.type === 'gap') { html += '<div class="line gap"></div>'; continue; }
    const r = s.results[i];
    html += lineHtml(numbers[i], it, r ? 's-' + r : 'context', r ? MARK[r] : '');
  }
  const indent = settings.strict ? '' : item.indent;
  const hasTip = item.tips.length > 0;
  const bulbTitle = s.hint === 0 && hasTip ? 'Show tip' : 'Reveal line';
  html += `
    <div class="line current">
      <span class="no">${numbers[cur]}</span>
      <span class="txt" style="flex:none">${indent}</span>
      <span class="typed"><span class="hl" id="hl"></span><input id="answer" autocomplete="off" spellcheck="false"></span>
      <button class="bulb" id="bulb" title="${bulbTitle} (Ctrl+/)" ${s.hint >= 2 ? 'disabled' : ''}>💡</button>
    </div>`;
  if (s.hint >= 1 && hasTip)
    html += `<div class="hintbox"><span class="lbl">tip</span>${item.tips.map(esc).join('<br>')}</div>`;
  if (s.hint >= 2)
    html += `<div class="hintbox reveal mono"><span class="lbl" style="font-family:system-ui">line</span><span data-hl>${esc(settings.strict ? item.code : item.code.trimStart())}</span></div>`;
  if (s.feedback) html += `<div class="feedback">${s.feedback}</div>`;
  const left = s.targets.length - s.pos - 1;
  if (left) html += `<div class="remaining">… ${left} more line${left > 1 ? 's' : ''} to go</div>`;

  const done = Object.values(s.results);
  app.innerHTML = `
    <div class="status">
      <b>${esc(s.prog.name)}</b>
      <span class="muted">${s.mode === 'full' ? 'Full pass' : 'Drilling weak lines'} · round ${s.round}</span>
      <span class="pill">line ${s.pos + 1}/${s.targets.length}</span>
      <span class="pill" style="color:var(--ok)">✓ ${done.filter(r => r === 'perfect').length}</span>
      <span class="pill" style="color:var(--warn)">✗ ${done.filter(r => r === 'mistake').length}</span>
      <span class="pill" style="color:var(--hint)">💡 ${done.filter(r => r === 'tip' || r === 'reveal').length}</span>
      <div class="spacer"></div>
      <button id="quit">Exit <kbd>Esc</kbd></button>
    </div>
    <div class="code">${html}</div>
    <div class="legend muted">
      <span><kbd>Enter</kbd> check line</span><span><kbd>Ctrl+/</kbd> hint</span>
      <span class="ok">✓ perfect</span><span class="w">✗ had mistakes</span><span class="h">💡 needed tip</span><span class="b">👁 revealed</span>
    </div>`;

  highlight(app);
  const input = $('#answer'), hl = $('#hl');
  // live syntax highlighting of what is being typed, kept aligned with the input's horizontal scroll
  let seq = 0;
  const paint = () => {
    hl.style.transform = `translateX(${-input.scrollLeft}px)`;
    if (!window.monaco) return;
    const n = ++seq;
    monaco.editor.colorize(input.value, 'python', { tabSize: 4 })
      .then(html => { if (n === seq) hl.innerHTML = html.replace(/<br\/?>\s*$/, ''); });
  };
  input.value = s.draft ?? '';
  input.focus();
  paint();
  input.oninput = () => { s.draft = input.value; paint(); };
  input.onscroll = input.onkeyup = input.onclick = () => { hl.style.transform = `translateX(${-input.scrollLeft}px)`; };
  input.onkeydown = e => {
    // stopPropagation: the result screen's Enter handler must not catch the Enter that finished the last line
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); check(input); }
    else if (e.key === 'Tab' && settings.strict) {
      e.preventDefault();
      document.execCommand('insertText', false, '    ');
    }
  };
  $('#bulb').onclick = hint;
  $('#quit').onclick = showLibrary;
  document.onkeydown = e => {
    if (e.key === 'Escape') showLibrary();
    else if (e.ctrlKey && e.key === '/') { e.preventDefault(); hint(); }
  };
}

function hint() {
  const s = session, item = s.items[s.targets[s.pos]];
  if (s.hint >= 2) return;
  s.hint = s.hint === 0 && item.tips.length ? 1 : 2;
  renderPractice();
}

function check(input) {
  const s = session, cur = s.targets[s.pos], item = s.items[cur];
  if (norm(input.value) === norm(item.code)) {
    s.results[cur] = s.hint === 2 ? 'reveal' : s.hint === 1 ? 'tip' : s.tries ? 'mistake' : 'perfect';
    Object.assign(s, { pos: s.pos + 1, hint: 0, tries: 0, draft: '', feedback: '' });
    renderPractice();
  } else {
    s.tries++;
    s.feedback = `Not quite (${s.tries} ${s.tries > 1 ? 'tries' : 'try'})${s.hint < 2 ? ' — press 💡 if you are stuck' : ''}`;
    const box = input.parentElement;
    box.classList.remove('wrong'); void box.offsetWidth; box.classList.add('wrong');
    $('.feedback') ? ($('.feedback').innerHTML = s.feedback) : renderPractice();
  }
}

function renderResult() {
  const s = session, p = s.prog;
  const weak = s.targets.filter(i => s.results[i] !== 'perfect');
  const score = Math.round(100 * (s.targets.length - weak.length) / s.targets.length);
  const secs = Math.round((Date.now() - s.started) / 1000);
  if (s.mode === 'full') {
    p.revisions++;
    p.lastScore = score;
    p.bestScore = Math.max(p.bestScore ?? 0, score);
    p.lastRevised = Date.now();
    (p.history ??= []).push({ score, at: p.lastRevised });
    save();
  }
  let n = 0; const numbers = {};
  s.items.forEach((it, i) => { if (it.type === 'code') numbers[i] = ++n; });

  let title, msg;
  if (!weak.length && s.mode === 'full') { title = 'Memorised ✓'; msg = 'Every line perfect, no hints. Come back later to keep it fresh.'; }
  else if (!weak.length) { title = 'Weak lines fixed'; msg = 'Now do a full pass to lock it in (that counts as a revision).'; }
  else { title = 'Keep going'; msg = `${weak.length} line${weak.length > 1 ? 's still need' : ' still needs'} work:`; }

  app.innerHTML = `
    <div class="result">
      <div class="row">
        <div>
          <h2>${title}</h2>
          <div class="muted">${esc(p.name)} · ${s.mode === 'full' ? 'full pass' : 'drill'} · ${Math.floor(secs / 60)}m ${secs % 60}s</div>
        </div>
        <div class="spacer"></div>
        <div class="score" style="color:${score === 100 ? 'var(--ok)' : score >= 70 ? 'var(--warn)' : 'var(--bad)'}">${score}%</div>
      </div>
      ${s.mode === 'full' ? `<p>Times revised – <b style="color:var(--accent)">${p.revisions}</b></p>` : ''}
      <p class="muted">${msg}</p>
      ${weak.length ? `<div class="code weak">${weak.map(i => lineHtml(numbers[i], s.items[i], 's-' + s.results[i], MARK[s.results[i]])).join('')}</div>` : ''}
      <div class="row">
        ${weak.length ? `<button class="primary" id="drill">Drill ${weak.length} weak line${weak.length > 1 ? 's' : ''} <kbd>Enter</kbd></button>` : ''}
        <button ${weak.length ? '' : 'class="primary"'} id="again">Full pass again ${weak.length ? '' : '<kbd>Enter</kbd>'}</button>
        <div class="spacer"></div>
        <button id="lib">Library <kbd>Esc</kbd></button>
      </div>
    </div>`;
  highlight(app);
  const drill = () => startSession(p.id, 'drill', weak);
  const again = () => startSession(p.id, 'full');
  if (weak.length) $('#drill').onclick = drill;
  $('#again').onclick = again;
  $('#lib').onclick = showLibrary;
  document.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); weak.length ? drill() : again(); }
    else if (e.key === 'Escape') showLibrary();
  };
}

applySettings();
showLibrary();
</script>
</body>
</html>
